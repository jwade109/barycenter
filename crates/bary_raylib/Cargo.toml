[package]
name = "bary_raylib"
version = "0.1.0"
edition = "2024"
default-run = "client_app"

[dependencies]
rand = "0.10.0"
raylib = "5.5.1"
bary_core = { path = "../bary_core" }
bary_factory = { path = "../bary_factory" }
bary_parts = { path = "../bary_parts" }
bary_ui = { path = "../bary_ui" }
bary_orbital = { path = "../bary_orbital" }
bary_input = { path = "../bary_input" }
bary_sim = { path = "../bary_sim" }
bary_terminal = { path = "../bary_terminal" }
bary_ipc = { path = "../bary_ipc" }
bary_server = { path = "../bary_server" }
rdev = { version = "0.5.3", features = ["serde", "serialize"] }
enum-iterator = "2.3.0"
steamworks = "0.12.2"
serde = { version = "1.0.228", features = ["derive"] }
bincode = "1.3.3"
log = "0.4.31"
env_logger = "0.11.9"
simple_logger = "5.2.0"
chrono = { version = "0.4.44", features = ["serde"] }
serde_yaml = "0.9.34"
toml = "1.0.3"
early_returns = "0.4.0"
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
md5 = "0.8.0"
rfd = "0.17.2"
image = "0.25.10"
shellwords = "1.1.0"

[[bin]]
name = "client_app"
path = "bin/client_app.rs"

[[bin]]
name = "steam"
path = "bin/steam.rs"

[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "my_benchmark"
harness = false
