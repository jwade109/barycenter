[package]
name = "bary_sim"
version = "0.1.0"
edition = "2024"

[dependencies]
bary_core.workspace = true
bary_parts = { path = "../bary_parts" }
bary_orbital = { path = "../bary_orbital" }
bary_factory = { path = "../bary_factory" }
serde = { version = "1.0.219", features = ["derive"] }
chrono = "0.4.44"
log = "0.4.31"
bincode = "1.3.3"
early_returns = "0.4.0"
zstd = "0.13.3"
clap = { version = "4.6.1", features = ["derive"] }
image = "0.25.10"
anyhow = "1.0.102"
serde_yaml = "0.9.34"
simple_logger = "5.2.0"

[[bin]]
name = "ship2png"
path = "bin/ship2png.rs"

[[bin]]
name = "generate_worlds"
path = "bin/generate_worlds.rs"
