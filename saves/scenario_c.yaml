# This is a very small toy example with two gravitational bodies and a number
# of ships of various classes.

- !LoadBlueprint ["pollux", 0]
- !LoadBlueprint ["pollux", 2]
- !LoadBlueprint ["remora", 0]
- !LoadBlueprint ["bellerophon", 0]
- !LoadBlueprint ["spacestation", 0]

- !SpawnPlanet
    name: Lado
    pos:
      translation: [0, 0]
      rotation: 0
    vel:
      translation: [0, 0]
      rotation: 0
    radius: 100
    mass: 3000000000000000

- !SpawnShip [["pollux", 0], "Bob", { translation: [130.0, 30.0], rotation: 2.0 }]
- !SetVelocity { translation: [0.0, 45.0], rotation: 0 }

- !SpawnShip [["spacestation", 0], "Sally", { translation: [130.0, 25.0], rotation: 1.3 }]
- !SetVelocity { translation: [0.0, 45.0], rotation: 0 }

- !SpawnShip [["bellerophon", 0], "Gerri", { translation: [500.0, 500.0], rotation: 0.3 }]
- !SetVelocity { translation: [-15.0, 12.0], rotation: 0.02 }

- !SpawnShip [["remora", 0], "Harold", { translation: [4000.0, 1200.0], rotation: 0.3 }]
- !SetVelocity { translation: [-3.0, 7.0], rotation: 0.02 }

- !SpawnPlanet
    name: Yol
    pos:
      translation: [3000, 3000]
      rotation: 0.3
    vel:
      translation: [-6, 6]
      rotation: 0
    radius: 40
    mass: 1000000000000000

- !SpawnShip [["pollux", 0], "Tammy", { translation: [3100.0, 3300.0], rotation: 0 }]
- !SetVelocity { translation: [-22.0, 6.0], rotation: -0.3 }

- !SpawnShip [["remora", 0], "Juan", { translation: [3000.0, 3300.0], rotation: 0.3 }]
- !SetVelocity { translation: [-21.0, 7.0], rotation: 0.1 }
