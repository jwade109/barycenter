name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - run: sudo apt-get update
    - run: sudo apt-get install -y --no-install-recommends libx11-dev python3-pip python3-dev libjpeg-dev zlib1g-dev xorg
    - uses: actions/checkout@v4
    - run: cargo build --release

  build-windows:
    runs-on: ubuntu-latest
    steps:
    - run: sudo apt-get update
    - run: sudo apt-get install -y --no-install-recommends libx11-dev python3-pip python3-dev libjpeg-dev zlib1g-dev xorg
    - uses: actions/checkout@v4
    - run: |
        rustup target add x86_64-pc-windows-gnu
        cargo build --release --target x86_64-pc-windows-gnu
