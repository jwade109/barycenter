name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install packages
      run: sudo apt install -y g++ pkg-config libx11-dev libxi-dev libasound2-dev libxkbcommon-x11-0
    - name: Build
      run: cargo build --release
    - name: Run tests
      run: cargo test

  build-windows:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install packages
      run: cargo build --target x86_64-pc-windows-gnu --release
