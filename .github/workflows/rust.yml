name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Linux
      run: cargo build --release
    - name: Windows
      run: cargo build --target x86_64-pc-windows-gnu --release
