name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - run: sudo apt-get update
    - run: sudo apt-get install -y libxtst-dev
        pkg-config libxi-dev libx11-dev python3-pip
        python3-dev libjpeg-dev zlib1g-dev xorg
        xrandr-dev xorg-xrandr
        libglu1-mesa-dev
    - uses: actions/checkout@v4
    - run: cargo build --release
    - uses: actions/upload-artifact@v7
      with:
        name: barycenter
        path: target/release/client_app
        archive: false

  build-windows:
    runs-on: ubuntu-latest
    steps:
    - run: sudo apt-get update
    - run: sudo apt-get install -y mingw-w64
        libxi-dev libx11-dev python3-pip python3-dev
        libjpeg-dev zlib1g-dev xorg
    - uses: actions/checkout@v4
    - run: rustup target add x86_64-pc-windows-gnu
    - run: cargo build --release --target x86_64-pc-windows-gnu
    - uses: actions/upload-artifact@v7
      with:
        name: barycenter.exe
        path: target/x86_64-pc-windows-gnu/release/client_app.exe
        archive: false
